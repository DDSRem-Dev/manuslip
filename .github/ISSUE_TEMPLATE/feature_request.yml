name: Feature request
description: Suggest a focused improvement to Manuslip.
title: "[Feature]: "
labels:
  - "enhancement"
  - "needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues and discussions first. Large changes should be discussed here before any code is written so we can align on direction.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is a single, scoped request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editing
        - Workspace
        - Translation
        - Export
        - Theming
        - Performance
        - Packaging and updates
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
