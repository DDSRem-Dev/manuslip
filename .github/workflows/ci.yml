name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repository is docs-only until the workspace manifests land. This job keeps
  # CI green meanwhile and signals whether there is anything for verify to run.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_package: ${{ steps.check.outputs.has_package }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect workspace manifests
        id: check
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json found - JavaScript checks are skipped until the workspace manifests land."
          fi

  verify:
    name: Verify (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has_package == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build
