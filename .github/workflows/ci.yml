name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"

      - run: npm run check:lockfile

      - run: npm run audit:dependencies

  verify:
    name: Verify (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm run check:lockfile

      - run: npm ci --no-audit --no-fund

      - run: npm run check

      - run: npm run test:unit

      - run: npm run test:integration

      - run: npm run test:packaging

      - run: npm run build:app

      - name: Export without Pandoc (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- test/e2e/pandoc.spec.ts

      - name: Export without Pandoc (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e -- test/e2e/pandoc.spec.ts

  pandoc:
    name: Pandoc (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm run check:lockfile

      - run: npm ci --no-audit --no-fund

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: "3.13"

      - name: Select Pandoc for native tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, realpathSync } from 'node:fs'
          const finder = process.platform === 'win32' ? 'where.exe' : 'which'
          const selected = execFileSync(finder, ['pandoc'], { encoding: 'utf8' }).trim().split(/\r?\n/)[0]
          const path = realpathSync(selected)
          const version = execFileSync(path, ['--version'], { encoding: 'utf8' })
          if (!/^pandoc 3\.13\r?\n/.test(version)) throw new Error('Expected Pandoc 3.13')
          appendFileSync(process.env.GITHUB_ENV, `MANUSLIP_TEST_PANDOC=${path}\n`)
          console.log(version.trim())
          NODE

      - run: npm run test:pandoc

      - run: npm run build:app

      - name: Pandoc desktop exports (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:pandoc:e2e

      - name: Pandoc desktop exports (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:pandoc:e2e

  packaged:
    name: Packaged desktop (${{ matrix.os }})
    if: github.event_name != 'schedule'
    needs: [dependencies, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-15]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run check:lockfile
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:package
      - name: Packaged workflows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Packaged workflows (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Windows install and uninstall
        if: runner.os == 'Windows'
        run: npm run test:installer
      - name: Retain test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-failure-${{ matrix.os }}
          path: |
            test/e2e/result/
            test/packaging/result/windows-installer-*/report.json
            test/packaging/result/windows-installer-*/*.png
          if-no-files-found: ignore
          retention-days: 7
